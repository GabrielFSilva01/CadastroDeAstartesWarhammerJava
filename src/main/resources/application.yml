# ============================================================
# application.yml — Configuração BASE do Cogitator Imperialis
# ============================================================
# Este arquivo contém APENAS configurações que são iguais
# em TODOS os ambientes (dev, prod, test).
#
# NUNCA coloque credenciais, URLs ou senhas aqui.
# Cada ambiente tem seu próprio arquivo de perfil:
#   application-Primarca_Ferreira.yml  → Dev local do Ferreira
#   application-prod.yml               → Produção (futuro)
#   application-test.yml               → Testes automatizados (futuro)
#
# Como ativar um perfil:
#   Opção 1 (via .env):      SPRING_PROFILES_ACTIVE=Primarca_Ferreira
#   Opção 2 (via terminal):  ./mvnw spring-boot:run -Dspring-boot.run.profiles=Primarca_Ferreira
#   Opção 3 (via IDE):       VM Options: -Dspring.profiles.active=Primarca_Ferreira
# ============================================================

spring:

  # ── Perfil padrão se nenhum for especificado ────────────────────────
  # Falha propositalmente se a env var não estiver definida:
  # evita que o app suba em "modo fantasma" com config errada.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # ── JPA — configurações agnósticas de ambiente ──────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'validate': Flyway gerencia o schema. Hibernate APENAS verifica
      # se as entidades batem com as tabelas. NUNCA altera o banco.
      # Isso previne alterações acidentais em produção.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        # JDBC Batching: agrupa inserts/updates — melhora performance em simulações
        jdbc:
          batch_size: 25
        order_inserts:  true
        order_updates:  true

  # ── Flyway — configurações comuns a todos os ambientes ──────────────
  flyway:
    enabled:             true
    locations:           classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Garante que scripts SQL são lidos como UTF-8 (acentos do português)
    encoding:            UTF-8

# ── Swagger UI — configuração base ──────────────────────────────────
springdoc:
  swagger-ui:
    path:               /swagger-ui.html
    operations-sorter:  method
    tags-sorter:        alpha
  api-docs:
    path: /v3/api-docs
